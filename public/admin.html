<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - QFwork.ai</title>
  <link rel="icon" href="logo-mark.png" />
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
    .topbar { background: #1e293b; border-bottom: 1px solid #334155; padding: 15px 26px; display: flex; align-items: center; gap: 11px; }
    .topbar img { width: 34px; height: 34px; }
    .brand { font-weight: 700; font-size: 16px; }
    .brand span { color: #FC5603; }
    .badge { background: #FC5603; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; margin-left: 10px; }
    
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 24px; }
    
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; }
    .stat-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-card .value { font-size: 36px; font-weight: 700; color: #f8fafc; }
    
    .table-card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; }
    .table-card h3 { padding: 20px; margin: 0; border-bottom: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-size: 13px; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .back-link { color: #94a3b8; text-decoration: none; display: inline-block; margin-bottom: 20px; }
    .back-link:hover { color: #f8fafc; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="/exam.html" style="display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit;">
      <img src="logo-mark.png" alt="" />
      <div class="brand">QFwork<span>.ai</span></div>
    </a>
    <div class="badge">Admin</div>
  </div>

  <div class="container">
    <a href="/exam.html" class="back-link">← Back to Homepage</a>
    <h1>Platform Overview</h1>

    <!-- Stats Cards -->
    <div class="grid">
      <div class="stat-card">
        <h3>Total Users</h3>
        <div class="value" id="statUsers">-</div>
      </div>
      <div class="stat-card">
        <h3>Total Reports</h3>
        <div class="value" id="statReports">-</div>
      </div>
      <div class="stat-card">
        <h3>Average Score</h3>
        <div class="value" id="statAvg">-</div>
      </div>
    </div>

    <!-- Recent Users Table -->
    <div class="table-card">
      <h3>Recent Registrations</h3>
      <table>
        <thead>
          <tr>
            <th>Email</th>
            <th>Date Joined</th>
          </tr>
        </thead>
        <tbody id="recentUsersTable">
          <tr><td colspan="2">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 1. Check if user is logged in and is an admin
    fetch('/api/admin/stats')
      .then(res => {
        if (res.status === 401) window.location.href = '/login.html';
        if (res.status === 403) window.location.href = '/dashboard.html'; // Kick non-admins out
        return res.json();
      })
      .then(data => {
        // 2. Populate stats
        document.getElementById('statUsers').textContent = data.totalUsers;
        document.getElementById('statReports').textContent = data.totalReports;
        document.getElementById('statAvg').textContent = data.averageScore + "/100";

        // 3. Populate recent users table
        const tbody = document.getElementById('recentUsersTable');
        if (data.recentUsers.length === 0) {
          tbody.innerHTML = '<tr><td colspan="2">No users yet.</td></tr>';
          return;
        }
        
        tbody.innerHTML = data.recentUsers.map(u => {
          const date = new Date(u.created_at).toLocaleDateString();
          return `<tr><td>${u.email}</td><td>${date}</td></tr>`;
        }).join('');
      })
      .catch(err => {
        console.error(err);
      });
  </script>
</body>
</html>
