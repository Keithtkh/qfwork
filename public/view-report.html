<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Report - QFwork.ai</title>
  <link rel="icon" href="logo-mark.png" />
  <style>
    :root{
      --teal:#FC5603; --teal-d:#E04B00; --orange:#FDA307;
      --ink:#101828; --mut:#667085; --line:#e7eaee; --bg:#f6f8fa; --card:#ffffff;
      --good:#15803d; --warn:#c2410c;
      --shadow:0 1px 2px rgba(16,24,40,.04), 0 12px 32px rgba(16,24,40,.06);
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 0; }
    
    /* Top Bar */
    .topbar { background: #fff; border-bottom: 1px solid var(--line); padding: 15px 26px; display: flex; align-items: center; gap: 11px; }
    .topbar a { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
    .topbar img { width: 34px; height: 34px; }
    .brand { font-weight: 700; font-size: 16px; }
    .brand span { color: var(--teal); }
    
    main { max-width: 800px; margin: 40px auto; padding: 0 20px 60px; }
    
    /* Reusing the exact classes from exam.html */
    h1.fbtitle{ font-size:30px; letter-spacing:-.02em; margin:0 0 18px; font-weight:600; }
    .hero-score{ display:flex; align-items:center; gap:24px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:var(--shadow); }
    .ring{ width:120px; height:120px; border-radius:50%; display:grid; place-items:center; flex:none; background:conic-gradient(var(--ring,var(--teal)) calc(var(--p)*1%), #e7eaee 0); }
    .ring i{ width:88px; height:88px; border-radius:50%; background:#fff; display:grid; place-items:center; font-style:normal; font-size:34px; font-weight:700; }
    .ring i u{ font-size:14px; color:var(--mut); font-weight:500; text-decoration:none; }
    .coach h3{ margin:0 0 6px; font-size:15px; }
    .coach p{ margin:0; line-height:1.55; }
    .metrics{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px; }
    .metric{ background:var(--card); border:1px solid var(--line); border-radius:13px; padding:15px; text-align:center; box-shadow:var(--shadow); }
    .metric b{ display:block; font-size:25px; font-weight:700; }
    .metric small{ color:var(--mut); font-size:12.5px; }
    .metric .mbar{ height:5px; background:#eef2f4; border-radius:999px; overflow:hidden; margin-top:9px; }
    .metric .mbar>div{ height:100%; border-radius:999px; }
    .band{ display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:4px 11px; border-radius:999px; margin-bottom:11px; }
    .sec{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-top:14px; box-shadow:var(--shadow); }
    .sec h3{ margin:0 0 10px; font-size:15px; }
    .sec ul{ margin:0; padding-left:18px; } .sec li{ margin:7px 0; line-height:1.5; }
    .cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
    .cols .sec{ margin-top:0; }
    .good-sec{ border-left:3px solid var(--good); } .warn-sec{ border-left:3px solid var(--warn); }
    .presence-sec{ border-left:3px solid var(--teal); }
    .voice-sec{ border-left:3px solid var(--orange); }
    .delivery{ display:grid; gap:13px; }
    .delivery>div{ display:grid; grid-template-columns:160px 1fr; gap:12px; align-items:start; line-height:1.5; }
    .delivery b{ color:var(--mut); font-weight:600; font-size:13px; }
    .model{ background:#effbf8; border:1px solid #cdeee8; border-radius:12px; padding:14px 16px; line-height:1.6; }
    .vchips{ display:flex; flex-wrap:wrap; gap:9px; margin:2px 0 15px; }
    .vchip{ display:inline-flex; flex-direction:column; gap:1px; background:#fff7f2; border:1px solid #f6ddd0; border-radius:10px; padding:8px 13px; font-size:11.5px; color:var(--mut); line-height:1.3; }
    .vchip b{ font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums; }
    .corr{ border-left:3px solid var(--line); padding:8px 0 8px 14px; margin:13px 0; }
    .corr .tag{ display:inline-block; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--warn); background:#fff4ed; border-radius:5px; padding:2px 7px; margin-right:8px; vertical-align:middle; }
    .corr .tag.good{ color:var(--good); background:#eafaf0; }
    .corr .o,.corr .bt{ color:var(--ink); line-height:1.5; } .corr .bt{ margin-top:7px; }
    .corr .r{ color:var(--mut); font-size:13px; margin-top:6px; }
    .foot{ color:var(--mut); font-size:12.5px; margin-top:18px; line-height:1.5; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="/dashboard.html">
      <img src="logo-mark.png" alt="" />
      <div class="brand">QFwork<span>.ai</span></div>
    </a>
  </div>

  <main>
    <div style="margin-bottom: 20px;">
      <a href="/dashboard.html" style="color: #667085; text-decoration: none; font-weight: 600; font-size: 14px;">← Back to Dashboard</a>
    </div>
    <div id="reportContainer">
      <p style="text-align: center; color: #667085; margin-top: 50px;">Loading your report...</p>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const reportId = params.get('id');

    if (!reportId) {
      $('reportContainer').innerHTML = '<p style="color: red;">No report ID provided.</p>';
    } else {
      loadReport();
    }

    async function loadReport() {
      try {
        const res = await fetch(`/api/reports/${reportId}`);
        if (!res.ok) throw new Error('Report not found or unauthorized');
        
        const data = await res.json();
        renderFeedback(data.report);
      } catch (err) {
        $('reportContainer').innerHTML = `<p style="color: red; text-align: center; margin-top: 50px;">${err.message}</p>`;
      }
    }

    function band(score) {
      if(score>=86) return { label:'Exceptional', color:'#15803d' };
      if(score>=71) return { label:'Strong',      color:'#0d7a6f' };
      if(score>=51) return { label:'Competent',   color:'#ca8a04' };
      if(score>=31) return { label:'Developing',  color:'#ea580c' };
      return            { label:'Needs work',  color:'#dc2626' };
    }

    function metric(label, v) {
      const has = (v ?? null) !== null;
      const col = has ? band(v).color : '#cbd5e1';
      return `<div class="metric"><b>${has ? v : '—'}</b><small>${label}</small>
        <div class="mbar"><div style="width:${has ? v : 0}%;background:${col}"></div></div></div>`;
    }

    function chip(v, label) {
      return `<span class="vchip"><b>${String(v)}</b>${label}</span>`;
    }

    function renderFeedback(f) {
      if(!f) return $('reportContainer').innerHTML = '<p>Empty feedback.</p>';
      
      const sc = f.scores || {}, da = f.deliveryAnalysis || {};
      const va = f.voiceAnalysis || {};
      const b  = band(f.overallScore || 0);
      const hasVoice = !!(va.toneIntonation || va.pacing || va.clarityPronunciation || va.vocalEnergy);

      // Sentence corrections
      const corr = (f.sentenceCorrections||[]).map(c => `
        <div class="corr">
          <div class="o"><span class="tag">Said</span>“${c.original}”</div>
          <div class="bt"><span class="tag good">Better</span>${c.better}</div>
          <div class="r">${c.reason}</div>
        </div>`).join('');

      $('reportContainer').innerHTML = `
        <h1 class="fbtitle serif">Your feedback</h1>
        <div class="hero-score" style="--ring:${b.color}">
          <div class="ring" style="--p:${f.overallScore||0}"><i>${f.overallScore ?? '—'}<u>/100</u></i></div>
          <div class="coach">
            <span class="band" style="background:${b.color}1a;color:${b.color}">${b.label}</span>
            <h3>Coach's take</h3>
            <p>${f.coachNote||''}</p>
          </div>
        </div>
        
        <div class="metrics">
          ${metric('Clarity', sc.clarity)}${metric('Professionalism', sc.professionalism)}
          ${metric('Confidence', sc.confidence)}${metric('Vocabulary', sc.vocabulary)}
        </div>
        
        <div class="sec"><h3>Summary</h3><p>${f.summary||''}</p></div>
        
        ${f.presenceFeedback ? `<div class="sec presence-sec"><h3>Presence on camera</h3><p>${f.presenceFeedback}</p>
          ${Array.isArray(f.presencePoints) && f.presencePoints.filter(Boolean).length ? `<ul>${f.presencePoints.filter(Boolean).map(p=>`<li>${p}</li>`).join('')}</ul>` : ''}
          <p class="foot" style="margin-top:9px;">Observed live by the AI's vision during the call.</p></div>` : ''}
        
        <div class="cols">
          <div class="sec good-sec"><h3>What worked</h3><ul>${(f.strengths||[]).map(s=>`<li>${s}</li>`).join('')}</ul></div>
          <div class="sec warn-sec"><h3>What to improve</h3><ul>${(f.improvements||[]).map(s=>`<li>${s}</li>`).join('')}</ul></div>
        </div>
        
        ${corr ? `<div class="sec"><h3>Line-by-line polish</h3>${corr}</div>` : ''}
        
        ${hasVoice ? `<div class="sec voice-sec"><h3>Voice &amp; delivery — measured from your audio</h3>
          <div class="delivery">
            ${va.toneIntonation ? `<div><b>Tone &amp; intonation</b><span>${va.toneIntonation}</span></div>` : ''}
            ${va.pacing ? `<div><b>Pacing &amp; pauses</b><span>${va.pacing}</span></div>` : ''}
            ${va.clarityPronunciation ? `<div><b>Clarity &amp; pronunciation</b><span>${va.clarityPronunciation}</span></div>` : ''}
            ${va.vocalEnergy ? `<div><b>Vocal energy</b><span>${va.vocalEnergy}</span></div>` : ''}
          </div>
        </div>` : ''}
        
        <div class="sec"><h3>Language delivery — from the transcript</h3><div class="delivery">
          <div><b>Filler words</b><span>${da.fillerWords||'—'}</span></div>
          <div><b>Hesitation</b><span>${da.hesitationAndStutter||'—'}</span></div>
          <div><b>Confidence markers</b><span>${da.confidenceMarkers||'—'}</span></div>
          <div><b>Pacing &amp; flow</b><span>${da.pacingFlow||'—'}</span></div>
        </div></div>
        
        ${f.rewrittenResponse ? `<div class="sec model-sec"><h3>Model answer</h3><div class="model">${f.rewrittenResponse}</div></div>` : ''}
      `;
    }
  </script>
</body>
</html>
